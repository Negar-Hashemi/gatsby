name: Test on Multiple OS

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18, 20, 22]
        attempt: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Debug System Information
        run: |
          echo "OS Info:"
          uname -a || systeminfo || ver
          echo "Node.js Version:"
          node -v
          echo "NPM Version:"
          npm -v

      - name: Ensure a Clean Environment
        run: |
          rm -rf node_modules package-lock.json
          echo "Clean environment setup complete."

      - name: Install dependencies
        run: |
          npm install --force
          npm list gatsby-core-utils || echo "gatsby-core-utils is missing"

      - name: Verify Gatsby Core Utils Installation
        run: ls -R node_modules/gatsby-core-utils || echo "gatsby-core-utils is missing"

      - name: Force Clean Build
        run: |
          npm run clean || echo "No clean script found, skipping..."
          npm run build || echo "Build script failed, check logs."

      - name: Testing on OS (${{ matrix.os }}) with Node.js (version ${{ matrix.node-version }}) attempt ${{ matrix.attempt }}
        run: |
          echo "Run attempt: ${{ matrix.attempt }}"
          npm test
